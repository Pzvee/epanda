<script>
// 按毕业届别分组。添加新一届：复制一项，改 year 与 photos 即可。
// 图片放在对应年份子目录，如 那年我们/23届/。
const memoriesByYear = [
  {
    year: '22届',
    photos: [
      '那年我们/22届/0.webp',
      '那年我们/22届/1.webp',
      '那年我们/22届/2.webp',
      '那年我们/22届/3.webp',
      '那年我们/22届/4.webp',
      '那年我们/22届/5.webp',
      '那年我们/22届/6.webp',
      '那年我们/22届/c1b2a09085255913c4c35d19478bd4d0.webp'
    ]
  }
  // 示例（添加时去掉注释）：
  // ,{ year: '23届', photos: ['那年我们/23届/xxx.webp'] }
];

const wrap = document.getElementById('memories-wrap');

memoriesByYear.forEach(group => {
  const head = document.createElement('div');
  head.className = 'section-header reveal';
  head.innerHTML = `<div class="section-label">毕业届</div><h2 class="section-title">${group.year}</h2>`;
  wrap.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'gallery-grid';
  group.photos.forEach((src, i) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.setAttribute('tabindex', '0');
    item.setAttribute('role', 'button');
    item.setAttribute('aria-label', `${group.year} 照片 ${i + 1}`);
    item.addEventListener('click', () => lightbox.open(group.photos, i));
    item.addEventListener('keydown', e => { if (e.key === 'Enter') lightbox.open(group.photos, i); });
    item.innerHTML = `<img src="${src.replace(/\.webp$/, '-480w.webp')}" alt="${group.year}" loading="lazy" decoding="async" width="480" height="360"><div class="gallery-item-overlay"><span>${group.year}</span></div>`;
    grid.appendChild(item);
  });
  wrap.appendChild(grid);
});
</script>
