<script>
const galleryData = {
  comp:  { label: '赛场风光', srcs: ['赛场风采/0f621cee9ff8188b8d302ba64991b88f.webp','赛场风采/2167d0da0937a531d7a6523113204352.webp','赛场风采/4ff3ac3840f05eeada0912845e038f71.webp','赛场风采/8b7aa279d0b76687a0329787a922b8da.webp','赛场风采/ac9c64ea395517a339cb739934ce79b6.webp','赛场风采/c71ae83ab3ab4a05e275a7b72318f01e.webp','赛场风采/d5b118e6d82dcdce4de8ea3973495642.webp','赛场风采/e3a7f97998e8a4bf677cd3000fe11f3e.webp','赛场风采/edb6f0248b528e7852458bc3c918b70b.webp'] },
  daily: { label: '场下点滴', srcs: ['场下点滴/25aeebfcb4945eaab7490c8689030d79.webp','场下点滴/3cc524ab3b440e6005a668bcc92a52e1.webp','场下点滴/627c09ecb86c07b57899d516c37f0bc0.webp','场下点滴/6582da9bb3907e02b5b1cc64736634f7.webp','场下点滴/7e234d1c7a881ee80077910e5827931e.webp'] },
  awards:{ label: '获奖荣誉', srcs: ['获奖荣誉/0146300a411f273c4b771275b526036c.webp','获奖荣誉/052c4c31ab9434b9733ad2c87d2d02af.webp','获奖荣誉/192ea0b6cc4e0316e8be5425418fbef4.webp','获奖荣誉/4788da663b3a7b1c9d42b0c571b32b8a.webp','获奖荣誉/6105dab8e3b80393361859aabcae3e85.webp','获奖荣誉/65e2810232b1157dd3ebf11d9a0af96d.webp','获奖荣誉/d569e40872d8d88e4f2c1ae3c62dd0e6.webp','获奖荣誉/da25be54ae76f4c4fa4926505fd2f5a5.webp'] },
  logos: { label: '车队 Logo', srcs: ['车队logo/matrix-media-1781438353229-ad0bd3ba.webp','车队logo/c62cd015cc3be12a70797cce63b0ef20.webp'] }
};

const grid = document.getElementById('gallery');
let allImages = [];

// Prebuild flat array for "all" mode
Object.values(galleryData).forEach(d => {
  d.srcs.forEach(src => allImages.push({ src, label: d.label }));
});

function render(cat) {
  grid.innerHTML = '';

  if (cat === 'all') {
    allImages.forEach(({ src, label }, i) => {
      grid.appendChild(createItem(src, label, () => {
        lightbox.open(allImages.map(x => x.src), i);
      }));
    });
  } else {
    const data = galleryData[cat];
    if (!data) return;
    data.srcs.forEach((src, i) => {
      grid.appendChild(createItem(src, data.label, () => {
        lightbox.open(data.srcs, i);
      }));
    });
  }
}

function thumbOf(src) { return src.replace(/\.webp$/, '-480w.webp'); }

function createItem(src, label, onClick) {
  const item = document.createElement('div');
  item.className = 'gallery-item';
  item.setAttribute('tabindex', '0');
  item.setAttribute('role', 'button');
  item.setAttribute('aria-label', label);
  item.addEventListener('click', onClick);
  item.addEventListener('keydown', e => { if (e.key === 'Enter') onClick(); });
  item.innerHTML = `<img src="${thumbOf(src)}" alt="${label}" loading="lazy" decoding="async" width="480" height="360"><div class="gallery-item-overlay"><span>${label}</span></div>`;
  return item;
}

document.querySelectorAll('.gallery-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.gallery-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    render(tab.dataset.cat);
  });
});

render('all');
</script>
